apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: p2f-portal
  annotations:
    acme.cert-manager.io/http01-edit-in-place: "true"
    cert-manager.io/cluster-issuer: harica
    ingress.citrix.com/insecure-termination: 
    ingress.citrix.com/backend-httpprofile: '{"app-1": {"dropinvalreqs":"enabled",
      "websocket" : "enabled"}}'
    ingress.citrix.com/frontend-httpprofile: '{"dropinvalreqs":"enabled", "websocket"
      : "enabled"}'
spec:
  ingressClassName: nsic-vpx
  rules:
  - host: {hostname}
    http:
      paths:
      - backend:
          service:
            name: p2f-portal
            port:
              number: 443
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - {hostname}
    secretName: p2f-portal-tls